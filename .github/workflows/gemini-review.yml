name: Gemini Code Review (on demand)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/gemini review') &&
      github.event.comment.author_association != 'NONE'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: React with eyes emoji
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            --method POST -f content=eyes

      - name: Read review prompt
        id: prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat .gemini/review-prompt.md
            echo "PROMPT_EOF"
          } >> $GITHUB_OUTPUT

      - name: Run Gemini review
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.issue.number }}.

            ${{ steps.prompt.outputs.content }}
